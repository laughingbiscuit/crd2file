name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # jq and yq (mikefarah) are already on GitHub's Ubuntu runners
      - name: Versions
        run: jq --version && yq --version
      - name: Test
        run: ./test/run.sh
